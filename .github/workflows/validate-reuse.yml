name: Validate REUSE Compliance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Allow manual trigger

jobs:
  reuse-lint:
    name: REUSE Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run REUSE lint
        uses: fsfe/reuse-action@v2
        with:
          args: lint

  markdown-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check links in markdown files
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/link-check-config.json'
        continue-on-error: true

  validate-yaml:
    name: Validate YAML Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate YAML files
        run: |
          pip install yamllint
          yamllint -d relaxed .github/ docs/ || echo "YAML validation warnings (non-blocking)"

  license-header-check:
    name: License Header Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for LICENSE file
        run: |
          if [ ! -f "LICENSE" ]; then
            echo "::error::LICENSE file not found in repository root"
            exit 1
          else
            echo "✓ LICENSE file found"
          fi

      - name: Check for README
        run: |
          if [ ! -f "README.md" ]; then
            echo "::warning::README.md not found - consider adding one"
          else
            echo "✓ README.md found"
          fi