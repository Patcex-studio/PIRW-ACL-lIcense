        // DOM Elements
        const renderedMd = document.getElementById('rendered-md');

        // --- Markdown Parser (Lightweight, Safe) ---
        
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function parseMarkdown(md) {
            let html = escapeHtml(md);
            const lines = html.split('\n');
            const result = [];
            let inList = false;
            let inBlockquote = false;
            let listBuffer = [];
            let quoteBuffer = [];

            const flushList = () => {
                if (inList) {
                    result.push('<ul>' + listBuffer.join('') + '</ul>');
                    listBuffer = [];
                    inList = false;
                }
            };

            const flushBlockquote = () => {
                if (inBlockquote) {
                    result.push('<blockquote>' + quoteBuffer.join('') + '</blockquote>');
                    quoteBuffer = [];
                    inBlockquote = false;
                }
            };

            for (let line of lines) {
                if (line.match(/^### /)) {
                    flushList(); flushBlockquote();
                    result.push('<h3>' + line.replace(/^### /, '') + '</h3>');
                    continue;
                }
                if (line.match(/^## /)) {
                    flushList(); flushBlockquote();
                    result.push('<h2>' + line.replace(/^## /, '') + '</h2>');
                    continue;
                }
                if (line.match(/^# /)) {
                    flushList(); flushBlockquote();
                    result.push('<h1>' + line.replace(/^# /, '') + '</h1>');
                    continue;
                }
                if (line.match(/^---+$/)) {
                    flushList(); flushBlockquote();
                    result.push('<hr>');
                    continue;
                }
                if (line.match(/^&gt; /)) {
                    flushList();
                    inBlockquote = true;
                    quoteBuffer.push(line.replace(/^&gt; /, '') + '<br>');
                    continue;
                } else {
                    flushBlockquote();
                }
                if (line.match(/^[-*] /)) {
                    inList = true;
                    listBuffer.push('<li>' + line.replace(/^[-*] /, '') + '</li>');
                    continue;
                } else {
                    flushList();
                }
                if (line.trim() === '') {
                    flushList(); flushBlockquote();
                    continue;
                }
                flushList(); flushBlockquote();
                result.push('<p>' + line + '</p>');
            }
            
            flushList(); flushBlockquote();

            let output = result.join('\n');
            output = output.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            output = output.replace(/\*(.*?)\*/g, '<em>$1</em>');
            output = output.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            output = output.replace(/`([^`]+)`/g, '<code>$1</code>');

            return output;
        }

        function postProcessHtml(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(`<div>${html}</div>`, 'text/html');
            const container = doc.body.firstChild;
            
            const h2s = Array.from(container.querySelectorAll('h2'));
            let kpHeader = null;
            
            for (let h of h2s) {
                if (h.textContent.trim() === 'Key Points') {
                    kpHeader = h;
                    break;
                }
            }

            if (kpHeader) {
                const wrapper = doc.createElement('div');
                wrapper.className = 'key-points-wrapper';
                
                let sibling = kpHeader;
                const toWrap = [];
                
                while (sibling) {
                    toWrap.push(sibling);
                    sibling = sibling.nextElementSibling;
                    if (sibling && sibling.tagName === 'H2') break;
                }

                toWrap.forEach(el => wrapper.appendChild(el));
                kpHeader.parentNode.insertBefore(wrapper, kpHeader);
            }

            return container.innerHTML;
        }

        // Render
        function render() {
            const rawHtml = parseMarkdown(DEFAULT_MD);
            const finalHtml = postProcessHtml(rawHtml);
            renderedMd.innerHTML = finalHtml;
        }

        // Init
        render();
    </script>
